# Example ~/.hermes/config.yaml for running hermes-x402 locally.
# Copy the relevant sections into your ~/.hermes/config.yaml.
# API keys go in ~/.hermes/.env (never in this file).

# --- Model ---
# Pick any provider you have a key for; examples below.
# Uncomment one block and add the key to ~/.hermes/.env.

# Anthropic Claude
# model:
#   provider: anthropic
#   name: claude-sonnet-4-5

# OpenAI
# model:
#   provider: openai
#   name: gpt-4o

# OpenRouter (200+ models, single key)
# model:
#   provider: openrouter
#   name: anthropic/claude-sonnet-4-5

# --- x402 plugin ---
x402:
  # Wallet provider (currently only local CDP tools).
  provider: local

  # CDP server-wallet account name (local provider).
  cdp_account_name: hermes-x402

  # Network: base-sepolia (testnet, default) or base (mainnet).
  network: base-sepolia

  # Local provider credentials go in ~/.hermes/.env (NEVER in this file):
  #   CDP_API_KEY_ID=...
  #   CDP_API_KEY_SECRET=...
  #   CDP_WALLET_SECRET=...
  # Fund the wallet: testnet via the cdp_faucet tool; mainnet via the cdp_onramp tool.

  # Per-call USDC cap and session ceiling. The session ceiling covers x402 paid calls.
  # Direct cdp_transfer is not an x402 payment; transfer ceilings are configured separately.
  max_price_usdc: 0.10
  session_budget_usdc: 5.0
  session_transfer_budget_usdc: 5.0   # cumulative USDC transfer cap per session
  session_transfer_budget_eth: 0.25   # cumulative ETH transfer cap per session

  # "strict" = refuse the paid call if any money guard can't be verified (recommended).
  failure_mode: strict

# --- Plugins ---
# hermes-x402 is discovered automatically via pip entry point once installed.
# To explicitly enable/disable:
# plugins:
#   enabled: [hermes-x402]
