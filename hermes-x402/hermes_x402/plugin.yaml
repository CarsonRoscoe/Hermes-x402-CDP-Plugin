name: hermes-x402
version: 0.0.1
description: x402 micropayments for Hermes — paid HTTP/MCP tools + a self-custodial CDP server wallet.
author: Coinbase
kind: standalone

# Tools surfaced to the agent (documentation/introspection; actual registration
# happens in register(ctx)). The cdp_* tools appear only under the "local" provider.
provides_tools:
  - x402_request
  - x402_retry_mcp_payment
  - cdp_wallet_status
  - cdp_wallet_balance
  - cdp_faucet
  - cdp_onramp
  - cdp_transfer
  - cdp_payments

# Lifecycle hooks this plugin attaches.
provides_hooks:
  - pre_tool_call
  - transform_tool_result
  - on_session_end
  - on_session_finalize

# Additional surfaces registered in register(ctx) (documented here for discoverability;
# the manifest schema only formally tracks tools + hooks):
#   - CLI:   hermes x402 {init,wallet,fund,balance,status,spend,payments,reconcile}
#   - slash: /x402 (wallet + provider + balance summary)
#   - skill: x402-payments (bundled local-wallet guidance)

# Wallet provider (x402.provider in config.yaml):
#   - "local" (default): self-custodial CDP server wallet + native cdp_* tools. Requires
#     CDP_API_KEY_ID, CDP_API_KEY_SECRET, CDP_WALLET_SECRET in ~/.hermes/.env.
# The plugin loads fine without credentials; the cdp_* tools report a clear error until set.
