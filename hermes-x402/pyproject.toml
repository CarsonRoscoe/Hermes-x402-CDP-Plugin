[project]
name = "hermes-x402"
version = "0.0.1"
description = "x402 micropayments for Hermes Agent: paid HTTP/MCP tool calls signed by a Coinbase MCP server, with discovery and onboarding."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Coinbase" }]
keywords = ["x402", "hermes", "agent", "payments", "usdc", "cdp", "coinbase"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Dependency pinning follows the Hermes policy: >=floor,<next_major so a
# bundled plugin never widens the host's supply-chain surface unexpectedly.
dependencies = [
    "x402[httpx,evm,mcp,extensions]>=2.11,<3",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
# Sync HTTP path (requests) for callers that prefer it over async httpx.
requests = ["x402[requests]>=2.11,<3"]
# Monetize / self-publish helper (seller side).
monetize = ["fastmcp>=2,<3"]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<0.7",
]

# Hermes discovers pip-installed plugins through this entry-point group. The
# left side is the plugin name surfaced by `hermes plugins list/enable`; the
# right side is the importable module exposing register(ctx).
[project.entry-points."hermes_agent.plugins"]
hermes-x402 = "hermes_x402"

# TEMPORARY — REMOVE BEFORE COMMIT.
# Links x402 to the local repo source so plugin changes can be tested against an unreleased
# x402 fix (the MCP payment-meta exclude_none serialization fix) instead of the published wheel.
# The x402 package uses a flat layout with hatchling force-include remapping, so this resolves
# as a local build (re-run `uv pip install -e ../../x402/python/x402 --no-deps` to pick up edits).
[tool.uv.sources]
x402 = { path = "../../x402/python/x402", editable = true }

[project.urls]
Homepage = "https://github.com/coinbase/hermes-x402"
Repository = "https://github.com/coinbase/hermes-x402"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hermes_x402"]

[tool.hatch.build.targets.sdist]
include = ["hermes_x402", "README.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
