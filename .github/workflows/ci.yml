name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    defaults:
      run:
        working-directory: hermes-x402

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: hermes-x402/pyproject.toml

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]" pytest-cov

      - name: Run ruff
        run: python -m ruff check .

      - name: Run tests with coverage
        run: python -m pytest --cov=hermes_x402 --cov-report=term-missing --cov-fail-under=60
